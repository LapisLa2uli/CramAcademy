# Nginx reverse proxy in front of Ollama (OpenAI-compatible API on :11434).
#
# Paste the `map` and `server` blocks below into your main nginx.conf inside `http { ... }`,
# or include this file from there:  include /path/to/nginx-ollama-proxy.conf;
#
# Use when the browser calls Ollama from:
#   - http://localhost:3000 (Next.js dev)
#   - https://cram-academy.vercel.app (production)
#
# Prerequisites: Ollama listening on http://127.0.0.1:11434
#
# Frontend: NEXT_PUBLIC_OLLAMA_BASE_URL=http://127.0.0.1:8080
#
# Start nginx after editing, then open the app from one of the allowed origins.
# Bind stays on 127.0.0.1 only — do not expose this port to the public internet without TLS and auth.

map $http_origin $cors_origin {
    default "";
    "http://localhost:3000"            $http_origin;
    "http://127.0.0.1:3000"            $http_origin;
    "https://cram-academy.vercel.app" $http_origin;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 100m;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        if ($cors_origin = "") {
            return 403;
        }

        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    }
}
