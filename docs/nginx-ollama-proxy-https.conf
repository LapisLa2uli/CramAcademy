# Nginx HTTPS reverse proxy in front of Ollama (OpenAI-compatible API on :11434).
#
# Use this when the app is loaded over **https://** (e.g. Vercel): the browser only allows
# **https://** requests to localhost from that page (mixed-content blocks http:// → Ollama).
#
# Paste the `map` and `server` blocks into `http { ... }` in nginx.conf, or:
#   include /path/to/nginx-ollama-proxy-https.conf;
#
# Prerequisites:
#   - Ollama on http://127.0.0.1:11434
#   - TLS certificate + key (see “Certificates” below)
#
# Frontend (example — this file listens on 127.0.0.1:8443):
#   NEXT_PUBLIC_OLLAMA_BASE_URL=https://127.0.0.1:8443
#
# Bind stays on 127.0.0.1 — do not expose this to the public internet without auth.
#
# --- Certificates (pick one) ---
#
# **mkcert** (recommended for dev — browser trusts the CA after `mkcert -install`):
#   mkcert -install
#   mkcert -cert-file ollama-local.pem -key-file ollama-local-key.pem 127.0.0.1 localhost
# Point ssl_certificate / ssl_certificate_key below at those files.
#
# **OpenSSL** (self-signed — browser will show a warning unless you import the CA):
#   openssl req -x509 -newkey rsa:4096 -keyout ollama-local-key.pem -out ollama-local.pem \
#     -days 365 -nodes -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
#
# ---

map $http_origin $cors_origin {
    default "";
    "http://localhost:3000"            $http_origin;
    "http://127.0.0.1:3000"            $http_origin;
    "https://cram-academy.vercel.app" $http_origin;
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name _;

    # Replace with paths from mkcert or openssl above.
    ssl_certificate     /path/to/ollama-local.pem;
    ssl_certificate_key /path/to/ollama-local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        if ($cors_origin = "") {
            return 403;
        }

        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    }
}
